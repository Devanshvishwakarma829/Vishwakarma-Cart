<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | Vishwakarma Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">🛒</span>
                <span>Vishwakarma <strong>Cart</strong></span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#products">Products</a>
                <a href="index.html#categories">Categories</a>
                <a href="cart.html">Cart</a>
            </nav>

            <div class="nav-actions">

                <a href="wishlist.html" class="nav-action">
                    ♡
                </a>

                <a href="cart.html" class="nav-action cart-btn">
                    🛒
                    <span class="cart-count">0</span>
                </a>

                <button class="login-btn" type="button">
                    Login
                </button>

            </div>

        </div>
    </header>


    <!-- ================= SUCCESS ================= -->

    <main class="success-page">

        <section class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <span class="success-label">
                ORDER CONFIRMED
            </span>

            <h1>Thank You! 🎉</h1>

            <p>
                Your order has been placed successfully.
                We appreciate your purchase from Vishwakarma Cart.
            </p>

            <div class="success-order-box">

                <span>ORDER STATUS</span>

                <strong>
                    ✓ Confirmed
                </strong>

            </div>

            <div class="success-actions">

                <a href="index.html#products" class="success-primary-btn">
                    🛍️ Continue Shopping
                </a>

                <a href="index.html" class="success-secondary-btn">
                    Back to Home
                </a>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
